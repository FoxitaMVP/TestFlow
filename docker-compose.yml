services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      TESTFLOW_DB_DRIVER: mysql
      TESTFLOW_DB_HOST: db
      TESTFLOW_DB_PORT: 3306
      TESTFLOW_DB_NAME: ${MYSQL_DATABASE:-testflow}
      TESTFLOW_DB_USER: ${MYSQL_USER:-testflow_user}
      TESTFLOW_DB_PASSWORD: ${MYSQL_PASSWORD:-testflow_password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testflow}
      MYSQL_USER: ${MYSQL_USER:-testflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testflow_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/mysql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:
